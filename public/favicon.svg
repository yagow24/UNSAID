<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching approved UNSAID Brand -->
    <linearGradient id="unsaid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ea8fc"/>
      <stop offset="25%" stop-color="#6582fd"/>
      <stop offset="60%" stop-color="#9a71f9"/>
      <stop offset="100%" stop-color="#e696f8"/>
    </linearGradient>

    <!-- Multi-layer Soft Depth Shadow -->
    <filter id="pill-depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#190e4a" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#24155b" flood-opacity="0.18"/>
    </filter>

    <!-- Pill Face Gradient -->
    <linearGradient id="pill-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f4fc"/>
    </linearGradient>

    <style>
      /* 1. BODY: Rhythmic pet dance groove + energetic dynamic HIGH JUMP */
      @keyframes unsaid-pet-jump-dance {
        /* Phase 1: Rhythmic Pet Dancing Groove (0% - 28%) */
        0% {
          transform: translateY(0) rotate(0deg) scale(1);
        }
        7% {
          transform: translateY(-8px) rotate(-4.5deg) scale(1.02, 1.01);
        }
        14% {
          transform: translateY(3px) rotate(-1deg) scale(1.03, 0.97);
        }
        21% {
          transform: translateY(-8px) rotate(4.5deg) scale(1.02, 1.01);
        }
        28% {
          transform: translateY(3px) rotate(1deg) scale(1.03, 0.97);
        }

        /* Phase 2: Crouch / Wind-up Squash before the big jump (32%) */
        32% {
          transform: translateY(7px) rotate(0deg) scale(1.1, 0.88);
        }

        /* Phase 3: HIGH JUMP Rocket launch & stretch (36%) */
        36% {
          transform: translateY(-34px) rotate(-1deg) scale(0.92, 1.14);
        }

        /* Phase 4: Floating in the air with joyful dance tilt (42% - 48%) */
        42% {
          transform: translateY(-46px) rotate(-3.5deg) scale(1.08, 1.05);
        }
        48% {
          transform: translateY(-44px) rotate(3.5deg) scale(1.08, 1.05);
        }

        /* Phase 5: Falling descent (53%) */
        53% {
          transform: translateY(-16px) rotate(0.5deg) scale(0.95, 1.08);
        }

        /* Phase 6: Landing cushion impact squash (57%) */
        57% {
          transform: translateY(8px) rotate(0deg) scale(1.1, 0.9);
        }

        /* Phase 7: Rebound hop (63%) */
        63% {
          transform: translateY(-6px) rotate(-1deg) scale(1.02, 1.02);
        }

        /* Phase 8: Playful victory shimmy (70% - 84%) */
        70% {
          transform: translateY(1px) rotate(2deg) scale(1);
        }
        77% {
          transform: translateY(-3px) rotate(-2deg) scale(1.01);
        }
        84% {
          transform: translateY(0) rotate(0deg) scale(1);
        }

        /* Phase 9: Calm pet breathing rest (92% - 100%) */
        92% {
          transform: translateY(-2px) scale(1.01, 1.02);
        }
        100% {
          transform: translateY(0) rotate(0deg) scale(1);
        }
      }

      /* 2. EYES: Anticipation -> Mid-air Squint (^ ^) -> Rest Blink */
      @keyframes unsaid-pet-eyes {
        0%, 30% {
          transform: scaleY(1) translateY(0);
        }
        34% {
          transform: scaleY(1.15) translateY(2px);
        }
        38% {
          transform: scaleY(0.4) translateY(-6px);
        }
        43%, 49% {
          transform: scaleY(0.24) translateY(-10px);
        }
        53% {
          transform: scaleY(0.45) translateY(-4px);
        }
        57% {
          transform: scaleY(0.9) translateY(2px);
        }
        63%, 84% {
          transform: scaleY(1) translateY(0);
        }
        88% {
          transform: scaleY(0.08);
        }
        91% {
          transform: scaleY(1);
        }
        93% {
          transform: scaleY(0.2);
        }
        95% {
          transform: scaleY(1.04);
        }
        98%, 100% {
          transform: scaleY(1);
        }
      }

      /* 3. MOUTH: Transforms into a BIG CHEERFUL SMILE during the high jump! */
      @keyframes unsaid-pet-mouth-neutral {
        0%, 35% { opacity: 1; transform: scale(1); }
        38%, 54% { opacity: 0; transform: scale(0.5) translateY(-8px); }
        57%, 100% { opacity: 1; transform: scale(1); }
      }

      @keyframes unsaid-pet-mouth-smile {
        0%, 36% { opacity: 0; transform: scale(0.5) translateY(12px); }
        39% { opacity: 1; transform: scale(0.9) translateY(2px); }
        43%, 50% { opacity: 1; transform: scale(1.12) translateY(-4px); }
        53% { opacity: 0.8; transform: scale(0.9) translateY(4px); }
        56%, 100% { opacity: 0; transform: scale(0.5) translateY(12px); }
      }

      /* 4. HIGH JUMP CELEBRATION SPARKLES */
      @keyframes unsaid-pet-bling-top {
        0%, 37% { opacity: 0; transform: scale(0) rotate(0deg); }
        41% { opacity: 1; transform: scale(1.35) rotate(45deg); }
        47% { opacity: 1; transform: scale(1.1) rotate(90deg); }
        53% { opacity: 0.8; transform: scale(0.7) rotate(135deg); }
        57%, 100% { opacity: 0; transform: scale(0) rotate(180deg); }
      }

      @keyframes unsaid-pet-bling-cheek {
        0%, 39% { opacity: 0; transform: scale(0); }
        43%, 51% { opacity: 0.95; transform: scale(1.1); }
        55% { opacity: 0; transform: scale(0); }
        100% { opacity: 0; }
      }

      .unsaid-jump-body {
        transform-origin: 256px 256px;
        animation: unsaid-pet-jump-dance 4.6s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
      }

      .unsaid-eye {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-eyes 4.6s infinite ease-in-out;
      }

      .unsaid-mouth-neutral {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-mouth-neutral 4.6s infinite ease-in-out;
      }

      .unsaid-mouth-smile {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-mouth-smile 4.6s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .unsaid-sparkle-top {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-bling-top 4.6s infinite ease-out;
      }

      .unsaid-sparkle-cheek {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-bling-cheek 4.6s infinite ease-out;
      }
    </style>
  </defs>

  <!-- Jumping & Dancing Pet Body -->
  <g class="unsaid-jump-body">
    <!-- Squircle Canvas -->
    <rect width="512" height="512" rx="116" fill="url(#unsaid-bg)"/>

    <!-- UNSAID Iconic Mark -->
    <g filter="url(#pill-depth)">
      <!-- Left Eye Capsule -->
      <rect class="unsaid-eye" x="106" y="138" width="56" height="198" rx="16" fill="url(#pill-face)"/>
      <!-- Right Eye Capsule -->
      <rect class="unsaid-eye" x="350" y="138" width="56" height="198" rx="16" fill="url(#pill-face)"/>

      <!-- Neutral Mouth Capsule -->
      <rect class="unsaid-mouth-neutral" x="182" y="327" width="148" height="46" rx="14" fill="url(#pill-face)"/>

      <!-- Curving Joyful Smile Arc -->
      <path
        class="unsaid-mouth-smile"
        d="M 184 332 Q 256 394 328 332"
        fill="none"
        stroke="url(#pill-face)"
        stroke-width="38"
        stroke-linecap="round"
      />

      <!-- Top Celebration Sparkle -->
      <path
        class="unsaid-sparkle-top"
        d="M 406 120 Q 406 148 378 148 Q 406 148 406 176 Q 406 148 434 148 Q 406 148 406 120 Z"
        fill="#ffffff"
      />

      <!-- Cheek Sparkle -->
      <path
        class="unsaid-sparkle-cheek"
        d="M 106 348 Q 106 362 92 362 Q 106 362 106 376 Q 106 362 120 362 Q 106 362 106 348 Z"
        fill="#ffffff"
      />
    </g>
  </g>
</svg>
