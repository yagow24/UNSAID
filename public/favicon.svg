<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching approved UNSAID Brand -->
    <linearGradient id="unsaid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ea8fc"/>
      <stop offset="25%" stop-color="#6582fd"/>
      <stop offset="60%" stop-color="#9a71f9"/>
      <stop offset="100%" stop-color="#e696f8"/>
    </linearGradient>

    <!-- Multi-layer Soft Depth Shadow -->
    <filter id="pill-depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#190e4a" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#24155b" flood-opacity="0.18"/>
    </filter>

    <!-- Pill Face Gradient -->
    <linearGradient id="pill-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f4fc"/>
    </linearGradient>

    <style>
      @keyframes unsaid-pet-dance-body {
        0% { transform: translateY(0) rotate(0deg) scale(1); }
        6% { transform: translateY(-7px) rotate(-4.5deg) scale(1.02); }
        12% { transform: translateY(2px) rotate(-1deg) scale(1.01, 0.98); }
        18% { transform: translateY(-7px) rotate(4.5deg) scale(1.02); }
        24% { transform: translateY(2px) rotate(1deg) scale(1.01, 0.98); }
        30% { transform: translateY(-4px) rotate(-3deg); }
        34% { transform: translateY(-4px) rotate(3deg); }
        38% { transform: translateY(-4px) rotate(-2deg); }
        42% { transform: translateY(1px) rotate(0deg); }
        48% { transform: translateY(-12px) rotate(0deg) scale(1.05); }
        54% { transform: translateY(-14px) rotate(-1.5deg) scale(1.06); }
        60% { transform: translateY(-10px) rotate(1.5deg) scale(1.05); }
        66% { transform: translateY(3px) rotate(0deg) scale(1.02, 0.96); }
        72% { transform: translateY(-2px) scale(1.01); }
        76% { transform: translateY(0) scale(1); }
        84% { transform: translateY(-2px) rotate(0.5deg); }
        90% { transform: translateY(1px) scale(0.99, 1.01); }
        96% { transform: translateY(-1px) rotate(-0.5deg); }
        100% { transform: translateY(0) rotate(0deg) scale(1); }
      }

      @keyframes unsaid-pet-eyes {
        0%, 44% { transform: scaleY(1) translateY(0); }
        48% { transform: scaleY(0.35) translateY(-8px); }
        54% { transform: scaleY(0.28) translateY(-10px); }
        60% { transform: scaleY(0.35) translateY(-8px); }
        66% { transform: scaleY(1) translateY(0); }
        84% { transform: scaleY(1); }
        88% { transform: scaleY(0.08); }
        91% { transform: scaleY(1); }
        93% { transform: scaleY(0.22); }
        95% { transform: scaleY(1.04); }
        98%, 100% { transform: scaleY(1); }
      }

      @keyframes unsaid-pet-mouth-neutral {
        0%, 44% { opacity: 1; transform: scale(1); }
        47%, 65% { opacity: 0; transform: scale(0.6) translateY(-5px); }
        68%, 100% { opacity: 1; transform: scale(1); }
      }

      @keyframes unsaid-pet-mouth-smile {
        0%, 45% { opacity: 0; transform: scale(0.6) translateY(8px); }
        48% { opacity: 1; transform: scale(1) translateY(0); }
        54% { opacity: 1; transform: scale(1.08) translateY(-2px); }
        62% { opacity: 1; transform: scale(1.04) translateY(-1px); }
        66% { opacity: 0; transform: scale(0.8) translateY(6px); }
        68%, 100% { opacity: 0; }
      }

      @keyframes unsaid-pet-bling-top {
        0%, 46% { opacity: 0; transform: scale(0) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.3) rotate(45deg); }
        56% { opacity: 1; transform: scale(1) rotate(90deg); }
        62% { opacity: 0.9; transform: scale(0.7) rotate(135deg); }
        66%, 100% { opacity: 0; transform: scale(0) rotate(180deg); }
      }

      @keyframes unsaid-pet-bling-cheek {
        0%, 48% { opacity: 0; transform: scale(0); }
        52% { opacity: 0.85; transform: scale(1); }
        58% { opacity: 0.85; transform: scale(0.9); }
        64%, 100% { opacity: 0; transform: scale(0); }
      }

      .unsaid-dance-body {
        transform-origin: 256px 256px;
        animation: unsaid-pet-dance-body 6s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
      }

      .unsaid-eye {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-eyes 6s infinite ease-in-out;
      }

      .unsaid-mouth-neutral {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-mouth-neutral 6s infinite ease-in-out;
      }

      .unsaid-mouth-smile {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-mouth-smile 6s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .unsaid-sparkle-top {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-bling-top 6s infinite ease-out;
      }

      .unsaid-sparkle-cheek {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-bling-cheek 6s infinite ease-out;
      }
    </style>
  </defs>

  <!-- Dancing Pet Body -->
  <g class="unsaid-dance-body">
    <!-- Squircle Canvas -->
    <rect width="512" height="512" rx="116" fill="url(#unsaid-bg)"/>

    <!-- UNSAID Iconic Mark -->
    <g filter="url(#pill-depth)">
      <!-- Left Eye Capsule -->
      <rect class="unsaid-eye" x="106" y="138" width="56" height="198" rx="16" fill="url(#pill-face)"/>
      <!-- Right Eye Capsule -->
      <rect class="unsaid-eye" x="350" y="138" width="56" height="198" rx="16" fill="url(#pill-face)"/>

      <!-- Neutral Mouth Capsule -->
      <rect class="unsaid-mouth-neutral" x="182" y="327" width="148" height="46" rx="14" fill="url(#pill-face)"/>

      <!-- Curving Joyful Smile Arc -->
      <path
        class="unsaid-mouth-smile"
        d="M 184 332 Q 256 394 328 332"
        fill="none"
        stroke="url(#pill-face)"
        stroke-width="38"
        stroke-linecap="round"
      />

      <!-- Top Celebration Sparkle -->
      <path
        class="unsaid-sparkle-top"
        d="M 406 120 Q 406 148 378 148 Q 406 148 406 176 Q 406 148 434 148 Q 406 148 406 120 Z"
        fill="#ffffff"
      />

      <!-- Cheek Sparkle -->
      <path
        class="unsaid-sparkle-cheek"
        d="M 106 348 Q 106 362 92 362 Q 106 362 106 376 Q 106 362 120 362 Q 106 362 106 348 Z"
        fill="#ffffff"
      />
    </g>
  </g>
</svg>
