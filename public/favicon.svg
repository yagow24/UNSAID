<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching approved UNSAID Brand -->
    <linearGradient id="unsaid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ea8fc"/>
      <stop offset="25%" stop-color="#6582fd"/>
      <stop offset="60%" stop-color="#9a71f9"/>
      <stop offset="100%" stop-color="#e696f8"/>
    </linearGradient>

    <!-- Multi-layer Soft Depth Shadow -->
    <filter id="pill-depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#190e4a" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#24155b" flood-opacity="0.18"/>
    </filter>

    <!-- Pill Face Gradient -->
    <linearGradient id="pill-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f4fc"/>
    </linearGradient>

    <style>
      @keyframes unsaid-pet-blink {
        0%, 86%, 100% {
          transform: scaleY(1);
        }
        89% {
          transform: scaleY(0.08);
        }
        92% {
          transform: scaleY(1);
        }
        94% {
          transform: scaleY(0.12);
        }
        96.5% {
          transform: scaleY(1);
        }
      }

      @keyframes unsaid-pet-bling {
        0%, 92% {
          opacity: 0;
          transform: scale(0) rotate(0deg);
        }
        95% {
          opacity: 1;
          transform: scale(1.2) rotate(45deg);
        }
        97.5% {
          opacity: 0.9;
          transform: scale(0.85) rotate(90deg);
        }
        100% {
          opacity: 0;
          transform: scale(0) rotate(135deg);
        }
      }

      .unsaid-eye {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-blink 3.8s infinite ease-in-out;
      }

      .unsaid-sparkle {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: unsaid-pet-bling 3.8s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Squircle Canvas (Modern Curvature) -->
  <rect width="512" height="512" rx="116" fill="url(#unsaid-bg)"/>

  <!-- UNSAID Iconic Mark -->
  <g filter="url(#pill-depth)">
    <!-- Left Eye Capsule -->
    <rect class="unsaid-eye" x="106" y="138" width="56" height="198" rx="16" fill="url(#pill-face)"/>
    <!-- Right Eye Capsule -->
    <rect class="unsaid-eye" x="350" y="138" width="56" height="198" rx="16" fill="url(#pill-face)"/>
    <!-- Center Mouth Capsule -->
    <rect x="182" y="327" width="148" height="46" rx="14" fill="url(#pill-face)"/>

    <!-- Pet Bling Sparkle -->
    <path
      class="unsaid-sparkle"
      d="M 406 128 Q 406 154 380 154 Q 406 154 406 180 Q 406 154 432 154 Q 406 154 406 128 Z"
      fill="#ffffff"
    />
  </g>
</svg>
